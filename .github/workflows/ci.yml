name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: kasir_ci
          MYSQL_USER: kasir_ci
          MYSQL_PASSWORD: ci-app-password
          TZ: Asia/Jakarta
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo_mysql, pdo_sqlite, tokenizer, xml
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run feature and unit tests (SQLite)
        run: php artisan test

      - name: Verify production route cache
        run: php artisan route:cache && php artisan route:clear

      - name: Verify MySQL migrations and seed
        env:
          APP_ENV: testing
          APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kasir_ci
          DB_USERNAME: kasir_ci
          DB_PASSWORD: ci-app-password
          DB_TIMEZONE: '+07:00'
          ADMIN_EMAIL: admin@rpcom.local
          ADMIN_PASSWORD: CI-Only-ChangeMe123!
        run: php artisan migrate:fresh --seed --force

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate

      - name: Validate Docker Compose configuration
        env:
          APP_DOMAIN: kasir.example.invalid
          APP_URL: https://kasir.example.invalid
          APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
          DB_DATABASE: kasir_ci
          DB_USERNAME: kasir_ci
          DB_PASSWORD: ci-app-password
          DB_ROOT_PASSWORD: ci-root-password
          ADMIN_PASSWORD: CI-Only-ChangeMe123!
        run: docker compose config --quiet

      - name: Build production web image
        run: docker build --target web --tag aplikasi-kasir-web-ci:latest .
